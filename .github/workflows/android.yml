name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SETOR_DEBUG_KEYSTORE: ${{ secrets.SETOR_DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # Semua APK harus bertanda tangan kunci yang sama, kalau tidak Android menolak update ("Aplikasi tidak terinstal").
      # Utama: secret SETOR_DEBUG_KEYSTORE (base64 PKCS12, sandi "android", alias androiddebugkey) → permanen.
      # Cadangan tanpa secret: kunci dibuat sekali lalu disimpan di cache.
      # shortcut: cache GitHub terhapus kalau 7 hari tanpa build, isi secret supaya tidak bergantung cache
      - name: Ambil kunci debug dari cache (kalau secret belum diisi)
        if: env.SETOR_DEBUG_KEYSTORE == ''
        uses: actions/cache@v4
        with:
          path: ~/setor-debug.p12
          key: setor-debug-keystore-v2
      - name: Siapkan kunci debug tetap
        run: |
          K="$HOME/setor-debug.p12"
          if [ -n "$SETOR_DEBUG_KEYSTORE" ]; then
            echo "$SETOR_DEBUG_KEYSTORE" | base64 -d > "$K"
          elif [ ! -f "$K" ]; then
            keytool -genkeypair -keystore "$K" -storetype PKCS12 -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Setor Debug" -keyalg RSA -keysize 2048 -validity 10000
            echo "::warning::Kunci debug baru dibuat (secret SETOR_DEBUG_KEYSTORE belum diisi). APK lama perlu di-uninstall sekali."
          fi
          echo "DEBUG_KEYSTORE_PATH=$K" >> "$GITHUB_ENV"
          keytool -list -keystore "$K" -storepass android | grep -i fingerprint

      - name: Versi dari tag (v1.2.3 → 1.2.3)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Unit test native (parser, jalur, format)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK debug (push ke main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Setor-${VERSION_NAME}-debug.apk"
          # nama tetap supaya link unduhnya tidak berubah tiap build
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Setor-latest-debug.apk"

      - name: Build APK rilis bertanda tangan (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi (lihat README)"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Setor-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Setor-apk
          path: Setor-*.apk

      - name: Terbitkan APK debug ke rilis "latest" (unduh tanpa login)
        if: "github.ref == 'refs/heads/main'"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (APK debug)
          prerelease: true
          body: |
            APK debug terbaru, dibuat otomatis dari branch `main`.
            Unduh **Setor-latest-debug.apk** di bawah, kirim ke HP, lalu pasang (izinkan "Instal aplikasi tidak dikenal").
          files: Setor-latest-debug.apk

      - name: Terbitkan GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Setor-*.apk
          generate_release_notes: true
